name: Central Risk form validation
on:
  pull_request:
    paths: ['risk.html', 'risk-central-create.*', 'risk-assessment-criteria.js', 'tests/risk-central-create.cjs', '.github/workflows/central-risk-validation.yml']
  push:
    branches: [main, 'vero/central-risk-live-20261016']
    paths: ['risk.html', 'risk-central-create.*', 'risk-assessment-criteria.js', 'tests/risk-central-create.cjs', '.github/workflows/central-risk-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check risk-central-create.js
      - run: node --test tests/risk-central-create.cjs
