name: VERO sidebar shell
on:
  pull_request:
    paths: ['*.html', '*.css', 'nav.js', 'tests/vero-shell.cjs', '.github/workflows/vero-shell-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --check nav.js
      - run: node tests/vero-shell.cjs
