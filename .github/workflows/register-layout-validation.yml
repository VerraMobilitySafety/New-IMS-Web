name: Register layout draft validation
on:
  pull_request:
    paths: ['register-layout.*', 'register-project-layout.*', 'project-management.html', 'register-governance-layout.*', 'records.html', 'risk.html', 'incident-management.*', 'register-operations-layout.*', 'maintenance-management.html', 'sites.html', 'users.html', 'my-actions.html', 'client-services-sites.html', 'insurance*', 'documents.html', 'documents-summary.*', 'documents-table.js', 'tests/documents-summary-browser.cjs', 'compliance.html', 'contractor-management.html', 'tests/*layout-browser.cjs', 'tests/insurance-boundaries-browser.cjs', '.github/workflows/register-layout-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check register-layout.js
      - run: node --check register-operations-layout.js
      - run: node --check register-governance-layout.js
      - run: node --check register-project-layout.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/governance-layout-browser.cjs
      - run: node tests/insurance-layout-browser.cjs
      - run: node tests/insurance-boundaries-browser.cjs
      - run: node tests/register-layout-browser.cjs
      - run: node tests/documents-summary-browser.cjs
      - run: node tests/operations-layout-browser.cjs
      - run: node tests/project-layout-browser.cjs
      - run: node --test tests/compliance-type-filters.cjs
      - run: node --test tests/risk-filters.cjs
      - name: Collect preview artifacts
        run: |
          mkdir -p register-previews
          cp ../preview/*.png register-previews/
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-register-previews
          path: register-previews/*.png
