name: SWMS helper browser validation
on:
  pull_request:
    paths: ['swms-helper.*', 'swms-service-documents.js', 'safe-work-method-statement.html', 'customer-contracts.js', 'maintenance-workspace.html', 'tests/swms-helper-browser.cjs', '.github/workflows/swms-helper-validation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/swms-helper-browser.cjs
