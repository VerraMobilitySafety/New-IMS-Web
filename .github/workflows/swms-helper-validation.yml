name: SWMS helper browser validation
on:
  pull_request:
    paths: ['swms-helper.*', 'swms-ai.js', 'swms-document.js', 'swms-service-documents.js', 'safe-work-method-statement.html', 'customer-contracts.js', 'maintenance-workspace.html', 'tests/swms-helper-browser.cjs', '.github/workflows/swms-helper-validation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Use installed Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "VERO_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node --test tests/swms-helper-browser.cjs
