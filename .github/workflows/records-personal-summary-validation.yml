name: Records personal summary validation
on:
  pull_request:
    paths: ['records.html', 'records-summary.js', 'records-register-layout.css', 'tests/records-layout-browser.cjs', '.github/workflows/records-personal-summary-validation.yml']
permissions:
  contents: read
jobs:
  personal-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check records-summary.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/records-layout-browser.cjs
