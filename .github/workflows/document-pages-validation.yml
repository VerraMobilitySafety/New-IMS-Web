name: Related document page links validation
on:
  pull_request:
    paths: ['page-related-documents.js', 'document-page-editor.js', 'tests/document-pages.cjs', '*.html']
jobs:
  page-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26.1.0
      - run: node --check page-related-documents.js && node --check document-page-editor.js
      - run: node --test tests/document-pages.cjs
