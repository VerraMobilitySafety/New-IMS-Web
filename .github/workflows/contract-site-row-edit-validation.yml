name: Administrator contract site row editing
on:
  pull_request:
    paths: ['maintenance-contract-activity.js', 'maintenance-contract-activity.css', 'maintenance-workspace.html', 'tests/contract-site-row-edit.cjs', '.github/workflows/contract-site-row-edit-validation.yml']
permissions:
  contents: read
jobs:
  contract-site-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/contract-site-row-edit.cjs tests/maintenance-contract-activity.cjs
