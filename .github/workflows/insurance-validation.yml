name: Insurance persistence validation
on:
  push:
    branches: ['review/insurance-audience-20261021', 'review/insurance-programmes-20261021', 'review/insurance-jurisdiction-20261021', 'review/insurance-persistence-20261020', 'review/insurance-records-20261021', 'review/insurance-registration-20261021', 'review/insurance-policy-preview-20261021', 'review/insurance-saved-policy-edit-20261021', 'review/insurance-drawer-20261021']
  pull_request:
    paths:
      - 'insurance.html'
      - 'insurance-live.js'
      - 'insurance-register.css'
      - 'tests/insurance-*.cjs'
      - '.github/workflows/insurance-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check insurance-live.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/insurance-persistence-browser.cjs
      - run: node tests/insurance-records-browser.cjs
      - run: node tests/insurance-unlink-browser.cjs
      - run: node tests/insurance-policy-preview-browser.cjs
      - run: node tests/insurance-edit-browser.cjs
      - run: node tests/insurance-jurisdiction-browser.cjs
      - run: node tests/insurance-geography-browser.cjs
      - run: node tests/insurance-programmes-browser.cjs
      - run: node tests/insurance-audience-browser.cjs
      - run: node tests/insurance-list-metadata-browser.cjs
      - run: node tests/insurance-drawer-browser.cjs
      - run: node tests/insurance-layout-browser.cjs
      - run: node tests/insurance-boundaries-browser.cjs
