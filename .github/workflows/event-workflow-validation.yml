name: Event workflow UI validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  event-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26.1.0
      - run: |
          node tests/event-workflow.cjs
          node tests/event-reopening.cjs
          node tests/event-tfnsw.cjs
          node tests/event-report-parity.cjs
          node tests/event-history.cjs
          node tests/event-drawer.cjs
          node tests/event-dashboard.cjs
          node tests/event-actions-dashboard.cjs
          node tests/event-period.cjs
          node tests/event-account.cjs
          node tests/event-people.cjs
      - run: node tests/event-history-tasks.cjs

      - run: node tests/event-history-investigations.cjs

      - run: node tests/event-owner-alias.cjs

      - run: node tests/event-monthly.cjs
      - run: node tests/event-list-sort.cjs
      - run: node tests/event-editor.cjs

      - run: node tests/event-response-recovery.cjs
      - run: node tests/event-injury-register.cjs

      - run: node tests/event-investigation-history.cjs

      - run: node tests/event-investigation-form.cjs

      - run: node tests/event-investigation-prefill.cjs

      - run: node tests/event-record-deletion.cjs

      - run: node tests/event-register-columns.cjs

      - run: node tests/event-investigation-review.cjs

      - run: node tests/event-historical-action-links.cjs

      - run: node tests/event-verification-fixture.cjs

      - run: node tests/event-investigation-ai.cjs
