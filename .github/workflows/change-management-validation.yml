name: Change Management browser validation
on:
  pull_request:
    paths: ['change-management.*', 'change-page-auth.js', 'page-related-documents.js', 'tests/change-header-loading-browser.cjs', 'nav.js', 'risk-assessment-form.js', 'tests/change-management-browser.cjs']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --check change-management.js
      - run: node tests/change-management-browser.cjs
      - run: node tests/change-header-loading-browser.cjs
