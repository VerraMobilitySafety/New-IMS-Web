name: Workflow corrections browser validation
on:
  pull_request:
    paths: ['project-management.html', 'project-workspace.html', 'project-request-save.js', 'compliance.html', 'compliance-correction.js', 'my-actions.html', 'tests/workflow-request-save.cjs', 'tests/compliance-correction-browser.cjs', '.github/workflows/workflow-corrections-validation.yml']
permissions:
  contents: read
jobs:
  corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/workflow-request-save.cjs tests/project-first-fixes.cjs tests/project-execution-initialization.cjs
      - run: node tests/compliance-correction-browser.cjs
