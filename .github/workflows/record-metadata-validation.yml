name: Records Administrator editor validation
on:
  pull_request:
    paths: ['records.html', 'record-metadata-editor.js', 'tests/record-metadata-browser.cjs', '.github/workflows/record-metadata-validation.yml']
permissions:
  contents: read
jobs:
  records-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/record-metadata-browser.cjs
