name: Reporting summary validation
on:
  pull_request:
    paths: ['reports.*', 'report-ai-summary.js', 'tests/report-ai-summary-browser.cjs', 'nav.js', 'tests/reports-browser.cjs', '.github/workflows/reports-validation.yml']
  push:
    branches: [main]
    paths: ['reports.*', 'report-ai-summary.js', 'tests/report-ai-summary-browser.cjs', 'nav.js', 'tests/reports-browser.cjs', '.github/workflows/reports-validation.yml']
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check reports.js && node --check report-ai-summary.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/reports-browser.cjs

      - run: node tests/report-ai-summary-browser.cjs
