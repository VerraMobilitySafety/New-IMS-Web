name: Continual Improvement details and editing validation
on:
  pull_request:
    paths: ['continual-improvement*', 'action-details*', 'my-actions.html', 'tests/continual-improvement-browser.cjs', '.github/workflows/continual-improvement-validation.yml']
  push:
    branches: [main]
    paths: ['continual-improvement*', 'action-details*', 'my-actions.html', 'tests/continual-improvement-browser.cjs', '.github/workflows/continual-improvement-validation.yml']
jobs:
  action-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/continual-improvement-browser.cjs
